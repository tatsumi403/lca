[project]
name = "lca"
version = "0.1.0"
description = "Local Coding Agent - a minimal, fully-local Claude Code-like CLI powered by Ollama"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
lca = "lca.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lca"]
